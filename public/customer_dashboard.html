<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .greeting {
            margin: 20px;
            font-size: 24px;
            color: #333;
        }

        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        .links a {
            text-decoration: none;
            color: #333;
            background-color: #fff;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, color 0.3s;
        }

        .links a:hover {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="greeting">Welcome to the Supplier Dashboard</div>
    <div class="links">
        <a href="/Purchase">Purchase Medicine</a>
        <a href="/request.html">status</a>
    </div>
</body>
</html>
